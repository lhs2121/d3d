<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1900" height="1340" viewBox="0 0 1900 1340">
  <defs>
    <marker id="arrow-blue" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M 0 0 L 12 6 L 0 12 z" fill="#2563eb"/>
    </marker>
    <marker id="arrow-green" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M 0 0 L 12 6 L 0 12 z" fill="#059669"/>
    </marker>
    <marker id="arrow-red" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M 0 0 L 12 6 L 0 12 z" fill="#dc2626"/>
    </marker>
    <marker id="arrow-gray" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M 0 0 L 12 6 L 0 12 z" fill="#64748b"/>
    </marker>
    <style>
      .bg { fill: #f8fafc; }
      .title { font: 800 42px "Malgun Gothic", "Segoe UI", sans-serif; fill: #0f172a; }
      .subtitle { font: 500 18px "Malgun Gothic", "Segoe UI", sans-serif; fill: #475569; }
      .card { stroke-width: 2.2; rx: 12; }
      .game { fill: #fff7ed; stroke: #f97316; }
      .common { fill: #ecfdf5; stroke: #10b981; }
      .input { fill: #eff6ff; stroke: #3b82f6; }
      .window { fill: #fdf2f8; stroke: #ec4899; }
      .renderer { fill: #f5f3ff; stroke: #8b5cf6; }
      .collision { fill: #f0fdfa; stroke: #14b8a6; }
      .external { fill: #f1f5f9; stroke: #64748b; }
      .build { fill: #fffbeb; stroke: #f59e0b; }
      .card-title { font: 800 24px "Malgun Gothic", "Segoe UI", sans-serif; fill: #111827; }
      .file { font: 600 14px Consolas, "Malgun Gothic", monospace; fill: #64748b; }
      .section { font: 800 15px "Malgun Gothic", "Segoe UI", sans-serif; fill: #334155; }
      .item { font: 14px Consolas, "Malgun Gothic", monospace; fill: #0f172a; }
      .desc { font: 13px "Malgun Gothic", "Segoe UI", sans-serif; fill: #475569; }
      .small { font: 12px "Malgun Gothic", "Segoe UI", sans-serif; fill: #64748b; }
      .edge { fill: none; stroke-width: 3.2; }
      .edge-label { font: 700 13px "Malgun Gothic", "Segoe UI", sans-serif; fill: #1e293b; }
      .pill { rx: 10; }
      .pill-text { font: 700 13px "Malgun Gothic", "Segoe UI", sans-serif; fill: #0f172a; }
      .note { font: 15px "Malgun Gothic", "Segoe UI", sans-serif; fill: #334155; }
    </style>
  </defs>

  <rect class="bg" x="0" y="0" width="1900" height="1340"/>

  <text class="title" x="60" y="70">D3D 프로젝트 라이브러리 연결도 + public 함수 설명서</text>
  <text class="subtitle" x="62" y="104">기준: x64 Debug 빌드 구조, Interface.h에 공개된 API, factory 함수로 구현 클래스를 생성하는 현재 네이밍</text>

  <rect class="card build" x="60" y="125" width="1780" height="92"/>
  <text class="card-title" x="88" y="161">빌드/링크 공통 규칙</text>
  <text class="item" x="88" y="190">engine_common.props: IncludePath=$(EngineRoot), LibraryPath=bin\$(Platform)\$(Configuration), OutDir=bin\$(Platform)\$(Configuration)</text>
  <text class="item" x="930" y="190">game_dependencies.props: commonlib.lib, inputlib.lib, collib.lib, windowlib.lib, rendererlib.lib</text>
  <text class="item" x="88" y="210">renderer_dependencies.props: commonlib.lib, d3d11.lib, dxgi.lib, d3dcompiler.lib, d2d1.lib, dwrite.lib, Shlwapi.lib, DirectXTex.lib</text>

  <rect class="card game" x="650" y="260" width="600" height="245"/>
  <text class="card-title" x="680" y="298">game / GameEngine</text>
  <text class="file" x="680" y="322">game/GameEngine.h, game/GameEngine.cpp</text>
  <text class="section" x="680" y="355">역할</text>
  <text class="desc" x="680" y="376">게임 상태, 월드/블록, 플레이어, 채굴 진행도, 프레임 업데이트를 조율</text>
  <text class="section" x="680" y="408">public</text>
  <text class="item" x="680" y="430">Start(title, x, y, width, height, hInstance) - 라이브러리 생성 후 루프 시작</text>
  <text class="item" x="680" y="452">Update() - IGameLoop 콜백, 입력/월드/렌더 한 프레임 처리</text>
  <text class="item" x="680" y="474">Release() - 생성한 라이브러리 객체 해제</text>

  <rect class="card common" x="60" y="595" width="500" height="315"/>
  <text class="card-title" x="90" y="633">commonlib</text>
  <text class="file" x="90" y="657">commonlib/Interface.h, Timer.*, Math.*, Debug.cpp</text>
  <text class="section" x="90" y="690">factory</text>
  <text class="item" x="90" y="712">CreateTimer(ITimer** ppTimer)</text>
  <text class="item" x="90" y="734">DeleteTimer(ITimer* timer)</text>
  <text class="section" x="90" y="766">ITimer</text>
  <text class="item" x="90" y="788">Initialize() - 고해상도 타이머 초기화</text>
  <text class="item" x="90" y="810">Reset() - 기준 시각 저장</text>
  <text class="item" x="90" y="832">GetElapsedSeconds() - Reset 이후 경과 초 반환</text>
  <text class="section" x="90" y="864">math / Debug</text>
  <text class="item" x="90" y="886">math::Vec2, Vec3, Vec4, Mat4, digits(), clamp()</text>
  <text class="item" x="90" y="908">Debug::CrtSetBreakAlloc(), CrtSetDbgFlag(), MsgBoxAssert()</text>

  <rect class="card input" x="700" y="595" width="500" height="315"/>
  <text class="card-title" x="730" y="633">inputlib</text>
  <text class="file" x="730" y="657">inputlib/Interface.h, Input.*</text>
  <text class="section" x="730" y="690">factory</text>
  <text class="item" x="730" y="712">CreateInput(IInput** ppInput)</text>
  <text class="item" x="730" y="734">DeleteInput(IInput* input)</text>
  <text class="section" x="730" y="766">IInput</text>
  <text class="item" x="730" y="788">Initialize() - 감시할 VK 키 등록</text>
  <text class="item" x="730" y="810">Update() - 키 상태를 Down/Pressed/Released/Free로 갱신</text>
  <text class="item" x="730" y="832">IsDown(key,user) - 이번 프레임 처음 눌림</text>
  <text class="item" x="730" y="854">IsPressed(key,user) - 누르고 있는 중</text>
  <text class="item" x="730" y="876">IsReleased(key,user) - 이번 프레임 뗌</text>
  <text class="item" x="730" y="898">IsFree(key,user), AddUser(user)</text>

  <rect class="card window" x="1340" y="595" width="500" height="315"/>
  <text class="card-title" x="1370" y="633">windowlib</text>
  <text class="file" x="1370" y="657">windowlib/Interface.h, Window.*</text>
  <text class="section" x="1370" y="690">factory</text>
  <text class="item" x="1370" y="712">CreateWindowInstance(IWindow** ppWindow)</text>
  <text class="item" x="1370" y="734">DeleteWindowInstance(IWindow* window)</text>
  <text class="section" x="1370" y="766">IGameLoop / IWindow</text>
  <text class="item" x="1370" y="788">IGameLoop::Update(), Release() - game으로 콜백</text>
  <text class="item" x="1370" y="810">Initialize(..., IGameLoop* gameLoop) - HWND 생성</text>
  <text class="item" x="1370" y="832">RunMessageLoop() - 메시지 루프, 매 프레임 Update 호출</text>
  <text class="item" x="1370" y="854">GetTitle(), GetDpi(), GetWidth(), GetHeight()</text>
  <text class="item" x="1370" y="876">GetPosX(), GetPosY(), GetHINSTANCE(), GetHWND()</text>

  <rect class="card collision" x="60" y="990" width="500" height="260"/>
  <text class="card-title" x="90" y="1028">collib</text>
  <text class="file" x="90" y="1052">collib/Interface.h, Collision.cpp</text>
  <text class="section" x="90" y="1085">namespace collib</text>
  <text class="item" x="90" y="1107">AABB { centerX, centerY, width, height }</text>
  <text class="item" x="90" y="1129">MakeAABB() - 중심/크기로 충돌 박스 생성</text>
  <text class="item" x="90" y="1151">Inset() - 충돌 박스 안쪽으로 축소</text>
  <text class="item" x="90" y="1173">Left(), Right(), Top(), Bottom() - 경계 좌표</text>
  <text class="item" x="90" y="1195">Intersects() - AABB 교차 검사</text>
  <text class="item" x="90" y="1217">ContainsPoint() - 점 포함 검사</text>

  <rect class="card renderer" x="700" y="990" width="500" height="260"/>
  <text class="card-title" x="730" y="1028">rendererlib</text>
  <text class="file" x="730" y="1052">rendererlib/Interface.h, Renderer.*, d3d.*</text>
  <text class="section" x="730" y="1085">factory / IRenderer</text>
  <text class="item" x="730" y="1107">CreateRenderer(IRenderer** ppRenderer), DeleteRenderer()</text>
  <text class="item" x="730" y="1129">Initialize(winW, winH, HWND&amp;) - D3D11 장치/스왑체인 생성</text>
  <text class="item" x="730" y="1151">BeginFrame(), EndFrame() - clear/present</text>
  <text class="item" x="730" y="1173">LoadTexture(path) - WIC/DDS/TGA 로드</text>
  <text class="item" x="730" y="1195">DrawBlockGrid(BlockGridDesc) - 타일 배치 렌더</text>
  <text class="item" x="730" y="1217">DrawSprite(SpriteDesc), DrawRectOutline(RectOutlineDesc)</text>

  <rect class="card external" x="1340" y="990" width="500" height="260"/>
  <text class="card-title" x="1370" y="1028">외부 API / thirdparty</text>
  <text class="file" x="1370" y="1052">Windows SDK, DirectXTex2022</text>
  <text class="section" x="1370" y="1085">rendererlib에서 사용</text>
  <text class="item" x="1370" y="1107">d3d11.lib, dxgi.lib - D3D11 device/swap chain</text>
  <text class="item" x="1370" y="1129">d3dcompiler.lib - HLSL compile</text>
  <text class="item" x="1370" y="1151">DirectXTex.lib - PNG/JPG/DDS/TGA texture load</text>
  <text class="section" x="1370" y="1184">windowlib에서 사용</text>
  <text class="item" x="1370" y="1206">Win32 HWND, message pump, cursor, DPI</text>
  <text class="item" x="1370" y="1228">CreateWindowA는 WinAPI라 factory 이름과 충돌 주의</text>

  <path class="edge" d="M 770 505 C 540 545, 390 560, 310 595" stroke="#059669" marker-end="url(#arrow-green)"/>
  <text class="edge-label" x="420" y="550">CreateTimer / deltaTime</text>

  <path class="edge" d="M 950 505 C 950 550, 950 560, 950 595" stroke="#2563eb" marker-end="url(#arrow-blue)"/>
  <text class="edge-label" x="970" y="555">CreateInput / key state</text>

  <path class="edge" d="M 1130 505 C 1340 545, 1500 560, 1590 595" stroke="#dc2626" marker-end="url(#arrow-red)"/>
  <text class="edge-label" x="1370" y="550">CreateWindowInstance / HWND</text>

  <path class="edge" d="M 1590 595 C 1590 520, 1270 485, 1180 450" stroke="#dc2626" marker-end="url(#arrow-red)"/>
  <text class="edge-label" x="1360" y="500">RunMessageLoop -&gt; IGameLoop::Update/Release</text>

  <path class="edge" d="M 830 505 C 620 770, 420 900, 310 990" stroke="#14b8a6" marker-end="url(#arrow-green)"/>
  <text class="edge-label" x="410" y="905">AABB collision</text>

  <path class="edge" d="M 1005 505 C 990 735, 970 860, 950 990" stroke="#8b5cf6" marker-end="url(#arrow-blue)"/>
  <text class="edge-label" x="995" y="900">CreateRenderer / draw calls</text>

  <path class="edge" d="M 1200 1105 C 1260 1105, 1280 1105, 1340 1105" stroke="#64748b" marker-end="url(#arrow-gray)"/>
  <text class="edge-label" x="1230" y="1090">DirectX / DirectXTex</text>

  <path class="edge" d="M 700 1120 C 600 1100, 570 960, 500 910" stroke="#059669" marker-end="url(#arrow-green)"/>
  <text class="edge-label" x="555" y="1010">math::Vec2/Vec4</text>

  <rect class="pill build" x="650" y="535" width="600" height="36"/>
  <text class="pill-text" x="678" y="558">GameEngine 멤버: ITimer* m_timer, IInput* m_input, IWindow* m_window, IRenderer* m_renderer</text>

  <text class="note" x="60" y="1305">읽는 법: 파란/초록/빨간 화살표는 game이 factory로 객체를 생성해 인터페이스 포인터로 쓰는 흐름, 회색 화살표는 rendererlib의 외부 의존성입니다.</text>
</svg>
